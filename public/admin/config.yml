# Decap CMS config — see README's "Editing content" section for what this
# is and how sign-in works. This file is the ONLY place that defines what
# shows up in the /admin editor; add a new field here and it appears there.

backend:
  name: github
  repo: samvelsiby/jdc-website
  branch: main
  base_url: https://jdc-website-sigma.vercel.app
  auth_endpoint: api/auth

# Edits commit straight to `main` and go live on the next deploy. Switch to
# "editorial_workflow" here if you'd rather review drafts before they publish.
publish_mode: simple

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "banner"
    label: "Announcement Banner"
    files:
      - file: "data/banner.json"
        name: "banner"
        label: "Announcement Banner"
        description: "The bar across the very top of every page, e.g. \"Applications are open!\""
        fields:
          - label: "Show the banner"
            name: "enabled"
            widget: "boolean"
            default: false
          - label: "Text"
            name: "text"
            widget: "string"

  - name: "gallery"
    label: "Gallery"
    files:
      - file: "data/gallery.json"
        name: "gallery"
        label: "Homepage Gallery"
        fields:
          - label: "Hero team photo"
            name: "HERO_TEAM_PHOTO"
            widget: "object"
            fields:
              - label: "Photo"
                name: "src"
                widget: "image"
                media_folder: "/public/images/gallery/comp2026"
                public_folder: "/images/gallery/comp2026"
              - label: "Alt text"
                name: "alt"
                widget: "string"
          - label: "26/27 gallery photos"
            name: "GALLERY_PHOTOS"
            widget: "list"
            summary: "{{caption}}"
            fields:
              - label: "Photo"
                name: "src"
                widget: "image"
                media_folder: "/public/images/gallery/comp2026"
                public_folder: "/images/gallery/comp2026"
              - label: "Caption"
                name: "caption"
                widget: "string"

  - name: "execs"
    label: "Exec Team"
    files:
      - file: "data/execs.json"
        name: "execs"
        label: "Exec Team"
        fields:
          - label: "Captain"
            name: "CAPTAIN"
            widget: "object"
            fields:
              - label: "Name(s)"
                name: "names"
                widget: "list"
                hint: "Usually one name. Co-VP roles that share a card get two."
              - label: "Role"
                name: "role"
                widget: "string"
              - label: "Role note"
                name: "roleNote"
                widget: "string"
                required: false
                hint: "Gloss for a title an outside visitor wouldn't recognize"
              - label: "Degree"
                name: "degree"
                widget: "string"
              - label: "Blurb"
                name: "blurb"
                widget: "text"
              - label: "Featured"
                name: "featured"
                widget: "boolean"
                required: false
                default: false
              - label: "Photos"
                name: "photos"
                widget: "list"
                required: false
                hint: "One photo per name above, same order. Leave empty to fall back to initials."
                field:
                  label: "Photo"
                  name: "photo"
                  widget: "image"
                  media_folder: "/public/images/execs"
                  public_folder: "/images/execs"
          - label: "Execs"
            name: "EXECS"
            widget: "list"
            summary: "{{fields.role}} — {{fields.names}}"
            fields:
              - label: "Name(s)"
                name: "names"
                widget: "list"
                hint: "Usually one name. Co-VP roles that share a card get two."
              - label: "Role"
                name: "role"
                widget: "string"
              - label: "Role note"
                name: "roleNote"
                widget: "string"
                required: false
                hint: "Gloss for a title an outside visitor wouldn't recognize"
              - label: "Degree"
                name: "degree"
                widget: "string"
              - label: "Blurb"
                name: "blurb"
                widget: "text"
              - label: "Featured"
                name: "featured"
                widget: "boolean"
                required: false
                default: false
              - label: "Photos"
                name: "photos"
                widget: "list"
                required: false
                hint: "One photo per name above, same order. Leave empty to fall back to initials."
                field:
                  label: "Photo"
                  name: "photo"
                  widget: "image"
                  media_folder: "/public/images/execs"
                  public_folder: "/images/execs"

  - name: "charities"
    label: "Charities"
    files:
      - file: "data/charities.json"
        name: "charities"
        label: "Charity Partners"
        fields:
          - label: "Charities"
            name: "CHARITIES"
            widget: "list"
            summary: "{{name}}"
            fields:
              - label: "Name"
                name: "name"
                widget: "string"
              - label: "Announced"
                name: "announced"
                widget: "boolean"
                default: true
              - label: "Logo"
                name: "logo"
                widget: "image"
                media_folder: "/public/images/charity-logos"
                public_folder: "/images/charity-logos"
              - label: "Donate URL"
                name: "donateUrl"
                widget: "string"
                required: false

  - name: "hero"
    label: "Homepage Hero"
    files:
      - file: "data/hero.json"
        name: "hero"
        label: "Homepage Hero"
        description: "The big intro block at the top of the homepage. The photo comes from the Gallery collection's \"Hero team photo\" field, not here."
        fields:
          - label: "Eyebrow (small line above the headline)"
            name: "eyebrow"
            widget: "string"
          - label: "Headline — part before the first colored word"
            name: "headlineBefore"
            widget: "string"
            hint: "e.g. \"Join us as we\""
          - label: "Headline — 1st colored word/phrase"
            name: "headlineAccent1"
            widget: "string"
            hint: "e.g. \"compete\""
          - label: "Headline — part between the two colored words"
            name: "headlineMiddle"
            widget: "string"
            hint: "e.g. \", fundraise, and road-trip our way to\""
          - label: "Headline — 2nd colored word/phrase"
            name: "headlineAccent2"
            widget: "string"
            hint: "e.g. \"JDC West 26/27\""
          - label: "Subtext (paragraph below the headline)"
            name: "subtext"
            widget: "text"
          - label: "Stamp text (the little circular stamp on the photo)"
            name: "stampText"
            widget: "string"
            hint: "e.g. \"26/27\" — keep it short, it's a small circle"
          - label: "Sticky note (on the photo collage)"
            name: "noteLines"
            widget: "list"
            hint: "Each item is one line of the note, e.g. \"practice tuesdays,\""

  - name: "about"
    label: "About Us"
    files:
      - file: "data/about.json"
        name: "about"
        label: "Homepage About Us"
        fields:
          - label: "First paragraph"
            name: "paragraph1"
            widget: "text"
          - label: "Second paragraph"
            name: "paragraph2"
            widget: "text"
          - label: "Stat tiles"
            name: "stats"
            widget: "list"
            summary: "{{n}} {{label}}"
            fields:
              - label: "Number"
                name: "n"
                widget: "number"
              - label: "Label"
                name: "label"
                widget: "string"

  - name: "sponsors"
    label: "Sponsors"
    files:
      - file: "data/sponsors.json"
        name: "sponsors"
        label: "Sponsor Wall"
        description: "Logos on the /sponsors page. Empty slots automatically show a \"your logo here\" placeholder."
        fields:
          - label: "Sponsors"
            name: "SPONSORS"
            widget: "list"
            summary: "{{name}}"
            fields:
              - label: "Name"
                name: "name"
                widget: "string"
              - label: "Logo"
                name: "logo"
                widget: "image"
                media_folder: "/public/images/sponsor-logos"
                public_folder: "/images/sponsor-logos"

  - name: "faqs"
    label: "FAQ"
    files:
      - file: "data/faqs.json"
        name: "faqs"
        label: "Homepage FAQ"
        fields:
          - label: "Questions"
            name: "FAQS"
            widget: "list"
            summary: "{{q}}"
            fields:
              - label: "Question"
                name: "q"
                widget: "string"
              - label: "Answer"
                name: "a"
                widget: "text"

  - name: "links"
    label: "Links & Contact"
    files:
      - file: "data/links.json"
        name: "links"
        label: "Links & Contact"
        fields:
          - label: "Apply form URL"
            name: "APPLY_FORM_URL"
            widget: "string"
          - label: "Donate URL"
            name: "DONATE_URL"
            widget: "string"
          - label: "Instagram URL"
            name: "INSTAGRAM_URL"
            widget: "string"
          - label: "LinkedIn URL"
            name: "LINKEDIN_URL"
            widget: "string"
          - label: "YouTube URL"
            name: "YOUTUBE_URL"
            widget: "string"
          - label: "Winnie Talks URL"
            name: "WINNIE_TALKS_URL"
            widget: "string"
          - label: "Chant video URL"
            name: "CHANT_VIDEO_URL"
            widget: "string"
          - label: "Contact email"
            name: "CORPORATE_EMAIL"
            widget: "string"
